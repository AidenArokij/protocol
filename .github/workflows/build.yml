name: Сборка установщика

on:
  workflow_dispatch:        # кнопка «Run workflow» — оставлена про запас
  push:
    branches: [main]        # сборка запускается сама при каждом обновлении файлов
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка Tauri CLI
        run: npm install

      - name: Генерация иконок
        run: npx tauri icon app-icon.png

      - name: Сборка и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PROTOCOL v__VERSION__'
          releaseBody: 'Скачайте файл *_x64-setup.exe ниже и установите.'
          releaseDraft: false
          prerelease: false
