<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОКОЛ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --serif:'PT Serif',Georgia,serif; --sans:'PT Sans',-apple-system,'Segoe UI',sans-serif;
  --bg:#1B1C1F; --panel:#242529; --panel2:#2B2C31; --text:#E8E6DE; --muted:#9C9C97;
  --accent:#B79A5E; --line:#38393D; --tag:#2C2D30;
  --ok:#7FA382; --warn:#CDB27A; --note:#8FA0AC;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;}

header{background:#151618;border-bottom:2px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:12px;flex:none;-webkit-app-region:drag;}
header svg{width:22px;height:24px;flex:none;}
header svg path{fill:none;stroke:var(--accent);stroke-width:2.2;}
header h1{font-family:var(--serif);font-size:1.05rem;margin:0;font-weight:700;}
header .meta{margin-left:auto;font-size:.74rem;color:var(--muted);}

#serverScreen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.server-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.server-card{width:200px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 16px;text-align:center;cursor:pointer;}
.server-card:hover{border-color:var(--accent);}
.server-card.disabled{opacity:.4;cursor:not-allowed;}
.server-card h3{font-family:var(--serif);margin:0 0 6px;}
.server-card p{font-size:.78rem;color:var(--muted);margin:0;}
#serverIntro{text-align:center;margin-bottom:26px;}
#serverIntro h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 6px;}
#serverIntro p{color:var(--muted);font-size:.85rem;max-width:480px;margin:0 auto;}

#mainScreen{flex:1;display:none;overflow:hidden;flex-direction:column;}
.toolbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex:none;}
.toolbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:2px;color:var(--text);padding:7px 10px;font-family:var(--sans);font-size:.85rem;}
.toolbar input:focus{outline:none;border-color:var(--accent);}
.toolbar button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:2px;padding:6px 10px;font-size:.78rem;cursor:pointer;}
.toolbar button:hover{border-color:var(--accent);color:var(--accent);}

.body{flex:1;display:flex;overflow:hidden;}
#sidebar{width:280px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:10px;}
#sidebar h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 4px 6px;}
.doc-item{padding:8px 10px;border-radius:2px;cursor:pointer;font-size:.85rem;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;align-items:center;}
.doc-item:hover{background:var(--panel2);}
.doc-item.active{background:var(--panel2);border-left:2px solid var(--accent);}
.badge{font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid currentColor;white-space:nowrap;}
.badge.verified{color:var(--ok);}
.badge.pending{color:var(--warn);}
.badge.note{color:var(--note);}

#content{flex:1;overflow-y:auto;padding:20px 26px;}
.doc-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.doc-header h2{font-family:var(--serif);margin:0 0 6px;}
.doc-header .status-line{font-size:.8rem;color:var(--muted);}
.doc-note{background:var(--tag);border-left:3px solid var(--warn);padding:8px 12px;font-size:.82rem;margin-top:8px;color:var(--muted);}
.chunk{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:10px;}
.chunk h4{font-family:var(--serif);color:var(--accent);margin:0 0 6px;font-size:.95rem;}
.chunk p{margin:4px 0;font-size:.88rem;}
.chunk .sanction{color:var(--muted);font-size:.82rem;}
.empty-hint{color:var(--muted);text-align:center;padding:60px 20px;font-size:.9rem;}
.search-source{font-size:.72rem;color:var(--muted);margin-bottom:2px;}
</style>
</head>
<body>

<header>
<svg viewBox="0 0 30 34"><path d="M15 1 L28 6 V16 C28 24 22 30 15 33 C8 30 2 24 2 16 V6 Z"/><path d="M15 8 V26 M9 12 H21" stroke-width="1.4"/></svg>
<h1>ПРОТОКОЛ</h1>
<span class="meta" id="serverBadge"></span>
</header>

<section id="serverScreen">
  <div>
    <div id="serverIntro">
      <h2>Выберите сервер</h2>
      <p>Законы и правила у каждого сервера свои. База ПРОТОКОЛА никогда не смешивает данные разных серверов.</p>
    </div>
    <div class="server-cards" id="serverCards"></div>
  </div>
</section>

<section id="mainScreen">
  <div class="toolbar">
    <button id="btnChangeServer">← сменить сервер</button>
    <input id="search" type="text" placeholder="Опишите вопрос своими словами или впишите номер статьи...">
  </div>
  <div class="body">
    <div id="sidebar"></div>
    <div id="content"><div class="empty-hint">Выберите документ слева или воспользуйтесь поиском.</div></div>
  </div>
</section>

<script>
const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

let currentServer = null;
let currentDocs = [];
let activeDocId = null;

const STATUS_CLASS = { 'Проверено':'verified', 'Требует проверки':'pending', 'Устарело':'pending', 'Не найдено в источнике':'pending', 'Заметка':'note' };

async function boot(){
  const servers = await invoke('get_servers');
  const box = document.getElementById('serverCards');
  box.innerHTML = servers.map(s => `
    <div class="server-card ${s.enabled ? '' : 'disabled'}" data-id="${s.id}">
      <h3>${s.name}</h3>
      <p>${s.enabled ? 'База загружена' : 'Пока не подключён'}</p>
    </div>`).join('');
  box.querySelectorAll('.server-card').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('disabled')) return;
      openServer(el.dataset.id, el.querySelector('h3').textContent);
    });
  });
}

async function openServer(id, name){
  currentServer = id;
  document.getElementById('serverBadge').textContent = 'Сервер: ' + name;
  document.getElementById('serverScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  currentDocs = await invoke('get_documents', { server: id });
  renderSidebar();
}

function renderSidebar(){
  const bySource = { law: [], protocol_note: [] };
  currentDocs.forEach(d => (bySource[d.source_type] || (bySource[d.source_type] = [])).push(d));

  let html = '<h4>Законодательство</h4>';
  html += (bySource.law || []).map(docRow).join('');
  if ((bySource.protocol_note || []).length){
    html += '<h4>Заметки ПРОТОКОЛА</h4>';
    html += bySource.protocol_note.map(docRow).join('');
  }
  document.getElementById('sidebar').innerHTML = html;
  document.querySelectorAll('.doc-item').forEach(el => {
    el.addEventListener('click', () => openDoc(Number(el.dataset.id)));
  });
}
function docRow(d){
  const cls = STATUS_CLASS[d.status] || 'pending';
  return `<div class="doc-item ${d.id===activeDocId?'active':''}" data-id="${d.id}">
    <span>${d.title}</span><span class="badge ${cls}">${d.status}</span>
  </div>`;
}

async function openDoc(id){
  activeDocId = id;
  renderSidebar();
  const doc = currentDocs.find(d => d.id === id);
  const chunks = await invoke('get_chunks', { documentId: id });
  const content = document.getElementById('content');
  let html = `<div class="doc-header">
    <h2>${doc.title}</h2>
    <div class="status-line">Статус: <b>${doc.status}</b>${doc.url ? ` · <a href="${doc.url}" target="_blank" style="color:var(--accent)">открыть источник</a>` : ''}</div>
    ${doc.note ? `<div class="doc-note">${doc.note}</div>` : ''}
  </div>`;
  html += chunks.map(c => `
    <div class="chunk">
      <h4>${c.article_no ? 'Ст. ' + c.article_no + ' — ' : ''}${c.heading}</h4>
      <p>${c.text}</p>
      ${c.sanction ? `<p class="sanction"><b>Санкция:</b> ${c.sanction}</p>` : ''}
    </div>`).join('');
  content.innerHTML = html;
  content.scrollTop = 0;
}

let searchTimer = null;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(() => runSearch(q), 180);
});

async function runSearch(q){
  const content = document.getElementById('content');
  if (!q.trim()){
    content.innerHTML = '<div class="empty-hint">Выберите документ слева или воспользуйтесь поиском.</div>';
    return;
  }
  const hits = await invoke('search', { server: currentServer, query: q });
  if (!hits.length){
    content.innerHTML = '<div class="empty-hint">Ничего не найдено в проверенной базе. Попробуйте другие слова.</div>';
    return;
  }
  content.innerHTML = hits.map(h => {
    const cls = STATUS_CLASS[h.document_status] || 'pending';
    return `<div class="chunk">
      <div class="search-source">${h.document_title} <span class="badge ${cls}">${h.document_status}</span></div>
      <h4>${h.chunk.article_no ? 'Ст. ' + h.chunk.article_no + ' — ' : ''}${h.chunk.heading}</h4>
      <p>${h.chunk.text}</p>
      ${h.chunk.sanction ? `<p class="sanction"><b>Санкция:</b> ${h.chunk.sanction}</p>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('btnChangeServer').addEventListener('click', () => {
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('serverScreen').style.display = 'flex';
  document.getElementById('search').value = '';
  activeDocId = null;
});

boot();
</script>
</body>
</html>
