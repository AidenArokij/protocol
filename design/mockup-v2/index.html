<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>РО Хелпер — макеты 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Tokens follow src/ui/tokens.css (style C). A theme swaps the glass; the accent hue follows the faction. */
:root {
  --font: 'Onest', system-ui, sans-serif;
  --hue: 245;
  --accent: oklch(0.78 0.1 var(--hue));
  --accent-hover: oklch(0.83 0.09 var(--hue));
  --accent-text: oklch(0.86 0.08 var(--hue));
  --accent-soft: oklch(0.78 0.1 var(--hue) / 0.18);
  --on-accent: #0d1118;
  --text: #fff;
  --text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  --text-muted: rgba(255, 255, 255, 0.58);
  --text-faint: rgba(255, 255, 255, 0.42);
  --surface: rgba(255, 255, 255, 0.07);
  --surface-hover: rgba(255, 255, 255, 0.11);
  --surface-active: rgba(255, 255, 255, 0.14);
  --line: rgba(255, 255, 255, 0.08);
  --penalty-text: oklch(0.85 0.11 25);
  --penalty-bg: oklch(0.7 0.16 25 / 0.16);
  --favorite: oklch(0.88 0.09 80);
  --badge-codes-text: oklch(0.87 0.07 245);
  --badge-codes-bg: oklch(0.78 0.1 245 / 0.22);
  --badge-charters-text: oklch(0.87 0.07 150);
  --badge-charters-bg: oklch(0.78 0.1 150 / 0.22);
  --badge-rules-text: rgba(255, 255, 255, 0.88);
  --badge-rules-bg: rgba(255, 255, 255, 0.13);
  --radius: 16px;
  --radius-sm: 10px;
  /* Theme: glass (default). */
  --panel-bg: rgb(15 15 18 / 0.62);
  --panel-filter: blur(28px) saturate(115%);
  --panel-border: rgba(255, 255, 255, 0.1);
  --panel-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
[data-theme='dense'] {
  --panel-bg: #17181c;
  --panel-filter: none;
  --panel-border: rgba(255, 255, 255, 0.07);
  --surface: #202227;
  --surface-hover: #272a30;
  --surface-active: #2d3037;
  --text-shadow: none;
}
[data-theme='minimal'] {
  --panel-bg: rgb(10 10 12 / 0.86);
  --panel-filter: blur(12px);
  --panel-border: transparent;
  --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  --surface: transparent;
  --surface-hover: rgba(255, 255, 255, 0.06);
  --surface-active: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.06);
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: #0b0c10;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.sp { flex: 1; }

/* The control bar is the mockup's own, not part of the app. */
.bar {
  display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
  padding: 12px 20px; background: #111217; border-bottom: 1px solid #22242b; font-size: 13px; color: #c9ccd4;
}
.bar h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; color: #fff; }
.seg { display: inline-flex; background: #1b1d23; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 11px; border-radius: 7px; color: #aeb3be; }
.seg button[aria-pressed='true'] { background: #2c3039; color: #fff; }
.bar label { color: #8b909b; margin-right: 6px; }

/* A stand-in for the game behind the overlay. */
.stage {
  flex: 1; position: relative; overflow: auto; padding: 36px;
  background:
    radial-gradient(1200px 500px at 20% 110%, #3b4a2e 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 0%, #5c3c2a 0%, transparent 55%),
    linear-gradient(180deg, #56708a 0%, #8a9aa6 45%, #4b5446 70%, #2d2f28 100%);
  display: flex; justify-content: center; align-items: flex-start; gap: 28px;
}
.stage::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 90px); pointer-events: none; }
.note {
  position: relative; z-index: 1; width: 260px; flex: none; font-size: 13px; line-height: 1.5; color: #fff;
  background: rgba(10, 12, 16, 0.72); border-radius: 12px; padding: 14px 16px; text-shadow: none;
}
.note h2 { font-size: 14px; margin: 0 0 6px; }
.note ul { padding-left: 18px; margin: 6px 0 0; }
.note li { margin: 4px 0; }

/* The overlay window. */
.panel {
  position: relative; z-index: 1; width: 470px; min-height: 600px; flex: none;
  background: var(--panel-bg); backdrop-filter: var(--panel-filter); -webkit-backdrop-filter: var(--panel-filter);
  border: 1px solid var(--panel-border); border-radius: var(--radius); box-shadow: var(--panel-shadow);
  text-shadow: var(--text-shadow); display: flex; flex-direction: column; overflow: hidden;
}
.panel--wide { width: 620px; flex-direction: row; }
.head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

/* Server + faction switcher. */
.switch {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500;
}
.switch:hover { background: var(--surface-hover); }
.switch .srv { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: rgba(0,0,0,.25); }
.switch .srv svg { width: 15px; height: 15px; }
.switch .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
.switch .fac { color: var(--accent-text); }
.chev { width: 12px; height: 12px; color: var(--text-faint); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: linear-gradient(135deg, oklch(0.7 0.14 280), oklch(0.62 0.16 320)); color: #fff; position: relative;
}
.avatar .sync { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; background: oklch(0.8 0.15 150); border: 2px solid #15161a; }

.search {
  margin: 4px 16px 12px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-faint); font-size: 14px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 17px; height: 17px; flex: none; }
.search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
.kbd { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface-active); color: var(--text-muted); }

.section { padding: 4px 16px 10px; }
.section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin: 8px 2px 8px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 6px; }
.tile:hover { background: var(--surface-hover); }
.tile .t { font-weight: 600; font-size: 14px; }
.tile .s { font-size: 12px; color: var(--text-muted); }
.tile .pen { font-size: 12px; color: var(--penalty-text); }
.badge { align-self: flex-start; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.b-codes { color: var(--badge-codes-text); background: var(--badge-codes-bg); }
.b-charter { color: var(--badge-charters-text); background: var(--badge-charters-bg); }
.b-rules { color: var(--badge-rules-text); background: var(--badge-rules-bg); }

.row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; }
.row:hover { background: var(--surface-hover); }
.row .lbl { color: var(--accent-text); font-weight: 600; min-width: 92px; }
.row .ttl { color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pen { color: var(--penalty-text); font-size: 12px; }
.row--dense { padding: 6px 10px; font-size: 13px; }
.row--sel { background: var(--accent-soft); }

.banner {
  margin: 0 16px 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px;
  background: var(--accent-soft); border: 1px solid oklch(0.78 0.1 var(--hue) / 0.35); display: flex; align-items: center; gap: 10px;
}
.banner b { color: var(--accent-text); }
.foot { margin-top: auto; padding: 10px 16px; font-size: 11.5px; color: var(--text-faint); border-top: 1px solid var(--line); display: flex; gap: 14px; }

/* Popover of the switcher. */
.pop {
  position: absolute; z-index: 5; top: 52px; left: 16px; right: 16px; padding: 12px; border-radius: 14px;
  background: rgb(22 23 28 / 0.97); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 60px rgba(0,0,0,.55);
}
.pop h4 { margin: 2px 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
.servers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.server { padding: 12px 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.server svg { width: 30px; height: 30px; }
.server[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); }
.server small { color: var(--text-faint); font-size: 11px; }
.factions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.faction { padding: 8px 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.faction i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: #0d1118; }
.faction[aria-pressed='true'] { border-color: oklch(0.78 0.1 var(--h)); background: oklch(0.78 0.1 var(--h) / 0.18); }

/* Direction C: side rail. */
.rail { width: 64px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
.rail .srvbig { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,.25); border: 1px solid var(--line); margin-bottom: 10px; }
.rail .srvbig svg { width: 24px; height: 24px; }
.rail .icon-btn { width: 42px; height: 42px; border-radius: 12px; }
.rail .icon-btn[aria-current='true'] { background: var(--accent-soft); color: var(--accent-text); }
.rail .icon-btn svg { width: 20px; height: 20px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Login. */
.login { padding: 40px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; flex: 1; justify-content: center; }
.login .logo { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-size: 28px; font-weight: 700; }
.login h2 { margin: 6px 0 0; font-size: 22px; }
.login p { margin: 0; color: var(--text-muted); font-size: 14px; max-width: 320px; line-height: 1.5; }
.oauth { width: 100%; max-width: 320px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.oauth svg { width: 20px; height: 20px; }
.oauth--discord { background: #5865f2; }
.oauth--tg { background: #2aabee; }
.login small { color: var(--text-faint); font-size: 12px; max-width: 320px; line-height: 1.5; }

/* Profile. */
.profile { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.pcard { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.pcard .avatar { width: 52px; height: 52px; font-size: 18px; }
.pcard .n { font-size: 16px; font-weight: 700; }
.pcard .m { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.role { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: oklch(0.85 0.12 80 / .2); color: var(--favorite); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.stat b { display: block; font-size: 20px; }
.stat span { font-size: 11.5px; color: var(--text-muted); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.barrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.barrow .bn { width: 120px; color: var(--text-muted); }
.barrow .bt { flex: 1; height: 7px; border-radius: 4px; background: var(--surface-active); overflow: hidden; }
.barrow .bt i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.syncline { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.syncline i { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.8 0.15 150); }
.memo { padding: 12px; border-radius: 12px; border: 1px solid oklch(0.85 0.12 80 / .35); background: oklch(0.85 0.12 80 / .1); font-size: 13px; line-height: 1.45; }
.memo b { color: var(--favorite); }

/* Settings (kept as is: grouped blocks). */
.set { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.block { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 4px 12px; }
.block h5 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
.setrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13.5px; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 0 10px; }
.theme { border-radius: 10px; padding: 8px; border: 1px solid var(--line); font-size: 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,.2); }
.theme[aria-pressed='true'] { border-color: var(--accent); }
.theme .sw { height: 34px; border-radius: 7px; }
.swatches { display: flex; gap: 8px; padding: 6px 0 10px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
.swatch[aria-pressed='true'] { border-color: #fff; }
.toggle { width: 34px; height: 20px; border-radius: 999px; background: var(--accent); position: relative; }
.toggle::after { content: ''; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div class="bar">
  <h1>РО Хелпер · макеты 2.0</h1>
  <span><label>Направление</label><span class="seg" data-key="dir">
    <button data-v="A">A · Карточки</button><button data-v="B">B · Компактная</button><button data-v="C">C · Боковое меню</button>
  </span></span>
  <span><label>Экран</label><span class="seg" data-key="screen">
    <button data-v="home">Главная</button><button data-v="switch">Сервер и фракция</button><button data-v="results">Поиск</button><button data-v="profile">Профиль</button><button data-v="settings">Настройки</button><button data-v="login">Вход</button>
  </span></span>
  <span><label>Тема</label><span class="seg" data-key="theme">
    <button data-v="glass">Стекло</button><button data-v="dense">Плотная</button><button data-v="minimal">Минимализм</button>
  </span></span>
</div>
<div class="stage" id="stage"></div>

    panel = `<div class="panel panel--wide">
      <nav class="rail">
        <button class="srvbig" data-act="switch" title="Сервер и фракция">${srvIcon(state.server)}</button>
        ${[['search', 'Поиск'], ['book', 'Документы'], ['calc', 'Калькулятор'], ['pin', 'Закреплённое'], ['memo', 'Памятки']].map(([k, t]) => `<button class="icon-btn" title="${t}" aria-current="${cur === k}" data-act="${k === 'search' ? 'home' : ''}">${I[k]}</button>`).join('')}
        <span class="sp"></span>
        <button class="icon-btn" title="Настройки" aria-current="${cur === 'gear'}" data-act="settings">${I.gear}</button>
        <button class="avatar" data-act="profile" style="margin-top:6px">SK<span class="sync"></span></button>
      </nav>
      <div class="main" style="position:relative">
        <div class="head"><span class="brand">${state.screen === 'profile' ? 'Профиль' : state.screen === 'settings' ? 'Настройки' : SRV[state.server].name}</span>${state.screen === 'profile' || state.screen === 'settings' ? '' : `<span class="switch" style="padding:3px 10px"><span class="fac">${fac()[1]}</span></span>`}<span class="sp"></span><button class="icon-btn">${I.close}</button></div>
        ${state.screen === 'profile' || state.screen === 'settings' ? '' : searchBox()}
        ${body()}
        ${foot}
      </div>
    </div>`;
  } else {
    const inner = state.screen === 'profile' || state.screen === 'settings';
    panel = `<div class="panel">
      <div class="head">
        ${state.dir === 'A' ? `<button class="icon-btn">${I.menu}</button>` : ''}
        ${inner ? `<span class="brand">${state.screen === 'profile' ? 'Профиль' : 'Настройки'}</span>` : state.dir === 'A' ? `<span class="brand">РО Хелпер</span>` : switcher()}
        <span class="sp"></span>
        ${!inner && state.dir === 'A' ? switcher() : ''}
        ${state.dir === 'B' ? `<button class="icon-btn" title="Калькулятор">${I.calc}</button><button class="icon-btn" title="Закреплённое">${I.pin}</button>` : ''}
        <button class="icon-btn" data-act="settings">${I.gear}</button>
        ${avatar()}
        <button class="icon-btn">${I.close}</button>
      </div>
      ${inner ? '' : searchBox()}
      ${body()}
      ${foot}
    </div>`;
  }

  const notes = {
    A: ['<b>A · Карточки</b>', 'Шапка: бренд слева, справа переключатель «сервер · фракция» с иконкой, профиль.', 'Главная: баннер обновления законов, памятка лидера, избранное плитками, недавние списком.', 'Больше воздуха, удобнее мышью.'],
    B: ['<b>B · Компактная</b>', 'Переключатель «сервер · фракция» сразу слева в шапке — главное действие.', 'Калькулятор и закреплённое — кнопками в шапке.', 'Плотные строки: больше статей на экране, удобнее с клавиатуры.'],
    C: ['<b>C · Боковое меню</b>', 'Слева узкая колонка: иконка сервера сверху (клик — смена сервера и фракции), разделы, настройки, профиль.', 'Окно шире (620 px), но разделы всегда на виду.', 'Место под будущие разделы: памятки, ИИ-разбор, заработок.'],
  }[state.dir];
  document.getElementById('stage').innerHTML =
    panel +
    `<aside class="note"><h2>${notes[0]}</h2><ul>${notes.slice(1).map((n) => `<li>${n}</li>`).join('')}</ul>
      <ul style="margin-top:10px;color:#b9bec8"><li>Акцент всего окна — в цвет фракции (смените фракцию в «Сервер и фракция»).</li><li>Иконки серверов — с вики Russia Online.</li></ul></aside>`;
}

document.addEventListener('click', (e) => {
  const seg = e.target.closest('.seg button');
  if (seg) { state[seg.parentElement.dataset.key] = seg.dataset.v; return render(); }
  const srv = e.target.closest('[data-srv]');
  if (srv) { state.server = srv.dataset.srv; return render(); }
  const f = e.target.closest('[data-fac]');
  if (f) { state.faction = f.dataset.fac; return render(); }
  const t = e.target.closest('[data-theme-pick]');
  if (t) { state.theme = t.dataset.themePick; return render(); }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act) { state.screen = state.screen === act.dataset.act ? 'home' : act.dataset.act; return render(); }
});

render();
</script>
</body>
</html>
